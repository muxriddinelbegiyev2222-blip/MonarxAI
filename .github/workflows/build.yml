name: Build MonarxAI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install cryptography customtkinter pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name MonarxAI --hidden-import cryptography --hidden-import customtkinter --collect-all customtkinter main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: MonarxAI-exe
        path: dist/MonarxAI.exe
